name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Release notes from CHANGELOG.md
        # The section under "## <tag> (date)", without its heading.
        run: |
          awk -v tag="$GITHUB_REF_NAME" '/^## / { if (found) exit; if ($2 == tag) { found = 1; next } } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
