# Mirrors `make check` against the same Postgres/Redis stack as local runs.
name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HS_TEST_DATABASE_URL: postgresql://hs:hs@127.0.0.1:56432/hs
      HS_TEST_REDIS_URL: redis://127.0.0.1:57379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The whole tree, not only the changed files the pre-commit hook sees.
      - name: Secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact
      # Generic provenance markers only.
      - name: Leak patterns
        run: |
          set +e
          git grep -nE '[[:alnum:]_]+[.]go([^[:alnum:]_]|$)|[a-z_]+[.]py:[0-9]+|[Ii]ssue #[0-9]+|PR #[0-9]+|[(]#[0-9]+[)]|\[(W|V|S|P|D|H|C)[0-9]+\]' -- . ':!uv.lock' ':!.github/workflows/ci.yml'
          rc=$?
          set -e
          [ "$rc" -eq 1 ] || { echo "internal reference found or git failed (exit $rc)"; exit 1; }
      # Compose rather than `services:`: Redis needs `--databases 64`, which services cannot pass.
      - run: docker compose -f docker/compose.test.yaml up -d --wait
      - run: make check SPEC_BASE=origin/${{ github.base_ref || 'main' }}

  # A reusable workflow, so the image is pushed only after `check` passed on this commit.
  image:
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
