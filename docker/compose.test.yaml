# Test stack: `docker compose -f docker/compose.test.yaml up -d`. Host ports move with HS_TEST_PG_PORT and
# HS_TEST_REDIS_PORT; point HS_TEST_DATABASE_URL and HS_TEST_REDIS_URL at the ones you pick.
name: human-specialist-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hs
      POSTGRES_PASSWORD: hs
      POSTGRES_DB: hs
    ports: ["127.0.0.1:${HS_TEST_PG_PORT:-56432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hs"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--databases", "64"]
    ports: ["127.0.0.1:${HS_TEST_REDIS_PORT:-57379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
