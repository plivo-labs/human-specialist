# Self-hosted stack: the service, Postgres and Redis, and with `--profile ui` the optional UI.
# `cp docker/.env.example docker/.env`, fill it in, then `docker compose -f docker/compose.yaml up`.
# `migrate` runs `alembic upgrade head` once; the service starts only if it succeeded.
name: human-specialist

x-hs: &hs
  image: ${COMPOSE_PROJECT_NAME:-human-specialist}:local
  # `up --build` builds this checkout and tags it with this project's name; compose never pulls it.
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: [.env]

services:
  migrate:
    <<: *hs
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  hs:
    <<: *hs
    ports:
      - "${PORT:-6004}:6004"
      # Prometheus metrics (METRICS_PORT); publish only where your monitoring can reach it.
      # - "9100:9100"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  ui:
    image: ${COMPOSE_PROJECT_NAME:-human-specialist}-ui:local
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    profiles: [ui]
    ports:
      - "${UI_PORT:-6005}:6005"
    environment:
      HS_UPSTREAM: ${HS_UPSTREAM:-hs:6004}
    depends_on: [hs]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hs
      POSTGRES_PASSWORD: hs
      POSTGRES_DB: hs
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hs"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # HS rebuilds what a Redis loss takes, but never a key Redis evicted.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped

volumes:
  pgdata:
