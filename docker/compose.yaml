# Self-hosted stack: the service, Postgres and Redis.
# `cp docker/.env.example docker/.env`, fill it in, then `docker compose -f docker/compose.yaml up`.
# `migrate` runs `alembic upgrade head` once; the service starts only if it succeeded.
name: human-specialist

x-hs: &hs
  image: ghcr.io/plivo-labs/human-specialist:0.1.0
  # Builds from this checkout when the image cannot be pulled.
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: [.env]

services:
  migrate:
    <<: *hs
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  hs:
    <<: *hs
    ports:
      - "${PORT:-6004}:6004"
      # Prometheus metrics (METRICS_PORT); publish only where your monitoring can reach it.
      # - "9100:9100"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hs
      POSTGRES_PASSWORD: hs
      POSTGRES_DB: hs
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hs"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
