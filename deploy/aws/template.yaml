AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  human-specialist on AWS: one Fargate task behind CloudFront and an Application Load Balancer, with RDS for
  PostgreSQL and ElastiCache for Valkey. Open the ConsoleUrl output when the stack is complete.

Parameters:
  PlivoAuthId:
    Type: String
    MinLength: 1
    Description: The Auth ID of the Plivo account that registers the first organization (HS_SETUP_PLIVO_AUTH_ID).
  Image:
    Type: String
    Default: ghcr.io/plivo-labs/human-specialist:1.0.0
    Description: The human-specialist image. Keep the default unless you run your own build.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable
  # Private: with no association they take the VPC's main route table, which has no route to the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.32.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.48.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]

  ServiceGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The load balancer to human-specialist
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6004, ToPort: 6004, SourceSecurityGroupId: !Ref LoadBalancerGroup }
  DataGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: human-specialist to PostgreSQL and Valkey
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ServiceGroup }
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref ServiceGroup }

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "hs"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  OperatorKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HS_OPERATOR_KEY, the bearer key for the operator routes
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  SecretKey:
    Type: AWS::SecretsManager::Secret
    # The database's final snapshot is useless without it, so it outlives the stack like the snapshot does.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: HS_SECRET_KEY; without it the stored Plivo tokens cannot be decrypted
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: human-specialist
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    # A bare major lets RDS pick its current minor, where a pinned minor retires; cfn-lint wrongly marks it deprecated.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3691
    Properties:
      Engine: postgres
      EngineVersion: "17"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: hs
      MasterUsername: hs
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DataGroup]
      PubliclyAccessible: false

  CacheSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: human-specialist
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  CacheParameters:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: valkey8
      Description: human-specialist never lets the cache evict a key
      Properties:
        maxmemory-policy: noeviction
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: human-specialist
      Engine: valkey
      EngineVersion: "8.0"
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 1
      CacheParameterGroupName: !Ref CacheParameters
      CacheSubnetGroupName: !Ref CacheSubnets
      SecurityGroupIds: [!Ref DataGroup]
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true

  # CloudFront reaches the internal load balancer only through its VPC origin, from CloudFront's origin-facing addresses.
  # Naming those needs the Region's prefix-list id, which a template cannot look up; with no public address and no route
  # from the internet, nothing outside the VPC reaches port 80 another way.
  LoadBalancerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The CloudFront VPC origin to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroups: [!Ref LoadBalancerGroup]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 6004
      HealthCheckPath: /status
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "10" }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    # A VPC origin needs an internet gateway attached to its VPC, though no traffic routes through it.
    DependsOn: GatewayAttachment
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub "${AWS::StackName}-${AWS::Region}"
        Arn: !Ref LoadBalancer
        OriginProtocolPolicy: http-only
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
              # The longest gap between packets of a response; the event stream pings every 15 s.
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer: every header, Authorization included

  Cluster:
    Type: AWS::ECS::Cluster
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseSecret, !Ref OperatorKey, !Ref SecretKey]
  # DATABASE_URL carries no password: libpq reads PGPASSWORD, so no secret sits in the task definition.
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Ref Image
          Essential: false
          Command: [alembic, upgrade, head]
          Environment:
            - Name: DATABASE_URL
              Value: !Sub "postgresql://hs@${Database.Endpoint.Address}:${Database.Endpoint.Port}/hs?sslmode=require"
          Secrets:
            - { Name: PGPASSWORD, ValueFrom: !Sub "${DatabaseSecret}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate
        - Name: hs
          Image: !Ref Image
          Essential: true
          DependsOn:
            - { ContainerName: migrate, Condition: SUCCESS }
          PortMappings:
            - { ContainerPort: 6004, Protocol: tcp }
          Environment:
            - Name: DATABASE_URL
              Value: !Sub "postgresql://hs@${Database.Endpoint.Address}:${Database.Endpoint.Port}/hs?sslmode=require"
            - { Name: REDIS_URL, Value: !Sub "rediss://${Cache.PrimaryEndPoint.Address}:${Cache.PrimaryEndPoint.Port}/0" }
            - { Name: PUBLIC_BASE_URL, Value: !Sub "https://${Distribution.DomainName}" }
            - { Name: HS_SETUP_PLIVO_AUTH_ID, Value: !Ref PlivoAuthId }
            # Longer than the load balancer's 60 s idle timeout, or it can reuse a connection uvicorn closed and answer 502.
            - { Name: UVICORN_TIMEOUT_KEEP_ALIVE, Value: "65" }
          Secrets:
            - { Name: PGPASSWORD, ValueFrom: !Sub "${DatabaseSecret}:password::" }
            - { Name: HS_OPERATOR_KEY, ValueFrom: !Ref OperatorKey }
            - { Name: HS_SECRET_KEY, ValueFrom: !Ref SecretKey }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: hs
  Service:
    Type: AWS::ECS::Service
    # The task pulls its image, reads its secrets and sends its logs over the public subnets' route to the internet.
    DependsOn: [Listener, DefaultRoute, SubnetARoutes, SubnetBRoutes]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref ServiceGroup]
      LoadBalancers:
        - { ContainerName: hs, ContainerPort: 6004, TargetGroupArn: !Ref TargetGroup }

Outputs:
  ConsoleUrl:
    Description: Open it and choose Register an organization. It is also PUBLIC_BASE_URL, the URL Plivo calls back.
    Value: !Sub "https://${Distribution.DomainName}"
  OperatorKeySecret:
    Description: The Secrets Manager secret holding HS_OPERATOR_KEY, for adding organizations after the first.
    Value: !Ref OperatorKey
