[project]
name = "human-specialist"
version = "0.1.0"
description = "Voice contact center engine on Plivo."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.2",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.2",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "SQLAlchemy==1.4.54",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs"]

[dependency-groups]
dev = [
    "fakeredis[lua]==2.40.0",
    # Test-only: the simulator's reference for V3 signatures and AccessToken JWTs.
    "plivo==4.63.0",
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
    # Pinned exactly: ruff's formatting shifts between releases.
    "ruff==0.17.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
version_files = [
    "docker/compose.yaml:ghcr.io/plivo-labs/human-specialist:",
    "src/hs/app.py:^    version=",
    "tests/contract/openapi.json:^    \"version\": ",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
xfail_strict = true
# A warning raised from hs/ is an error, and so is any use of pydantic's v1 API.
filterwarnings = ['error:::hs\.', "error::pydantic.warnings.PydanticDeprecatedSince20"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "."]
# extend-exclude keeps ruff's defaults (.git, .venv, build, dist, ...). Markdown is prose, not source.
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PIE", "T10", "T20", "FIX", "ERA", "C4", "RUF", "S", "C90"]
ignore = [
    "E501",    # the formatter owns line length; long literals stay
    "RUF012",  # pydantic and SQLAlchemy class attributes are not shared mutable state
    "S311",    # random is used for jitter and ids that are not secrets
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
"alembic/**" = ["ERA001"]

